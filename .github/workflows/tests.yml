name: tests

# Pull requests, pushes to main, and a manual button.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the in-flight run; runs on main are left to finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: this job builds and tests but never writes to the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The suite links OpenSSL (libcrypto) and Argon2, and compiles the SQLite
      # amalgamation. build-essential brings gcc plus libasan/libubsan, which the
      # fuzz-regress stage of `make test` needs (it replays the crash seeds under
      # ASan+UBSan). unzip is for the amalgamation archive below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libargon2-dev unzip
          gcc --version

      # SQLite is vendored as a downloaded amalgamation, not committed source.
      # See vendor/setup_notes.txt — matching commands here proves those instructions.
      - name: Vendor the SQLite amalgamation
        run: |
          mkdir -p vendor/sqlite
          curl -fsSL -o sqlite3.zip https://www.sqlite.org/2026/sqlite-amalgamation-3510200.zip
          unzip -jo sqlite3.zip "*/sqlite3.c" "*/sqlite3.h" -d vendor/sqlite
          rm sqlite3.zip

      # test-db and test-crypto call config_load("auth.conf"). auth.conf is gitignored
      # (it's the live, per-deployment config); the committed example is a complete
      # SQLite config whose db_path (./data/auth.db) and schema_dir (./sql) both exist
      # in a fresh checkout, so a straight copy is all CI needs.
      - name: Provide a test configuration
        run: cp auth.conf.example auth.conf

      # `make test` builds and runs every suite (str, http, router, db, crypto), then
      # replays the fuzz regression seeds under ASan+UBSan via fuzz-regress.
      # pipefail so make's exit code survives the pipe through tee —
      # the default shell is `bash -e`, which would otherwise see only tee succeed.
      - name: Build and run the test suite
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/test.log

      # The Makefile compiles with -Wall -Wextra but not -Werror, so a warning prints
      # and the build still passes. Here, fail on any warning.
      # The pattern matches the compiler's "path:line:col: warning:" diagnostic,
      # but avoids tripping over WARN log lines the server itself writes to this log.
      # The SQLite amalgamation is third-party and excluded.
      - name: Fail on compiler warnings in project code
        run: |
          if grep -v 'vendor/sqlite' /tmp/test.log | grep -E -A4 ':[0-9]+:[0-9]+: warning:'; then
            echo "::error::compiler emitted warnings in project code"
            exit 1
          fi
          echo "No warnings in project code."

  # The backend is a compile-time choice, so half the #ifdefs in src/db/ are invisible
  # to the job above. This one compiles the other half. It deliberately does not run
  # tests: those need a live PostgreSQL server, and the risk this guards is a build
  # break in backend-conditional code, which a compile catches on its own.
  # Runs in parallel with build-and-test, and is the lighter of the two — no
  # amalgamation to download or compile, no ASan replay.
  build-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # libpq-dev carries both halves of what the Makefile wants: pg_config, which
      # resolves the include path, and libpq itself for -lpq.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libargon2-dev libpq-dev
          pg_config --includedir

      - name: Build against PostgreSQL
        run: |
          set -o pipefail
          DB_BACKEND=postgresql make 2>&1 | tee /tmp/pg.log

      # Same gate as above, without the vendor filter: no third-party source is
      # compiled here, and libpq's headers come in via -isystem so its diagnostics
      # (if any ever appear) are suppressed rather than filtered.
      - name: Fail on compiler warnings in project code
        run: |
          if grep -E -A4 ':[0-9]+:[0-9]+: warning:' /tmp/pg.log; then
            echo "::error::compiler emitted warnings in the PostgreSQL build"
            exit 1
          fi
          echo "No warnings in project code."
